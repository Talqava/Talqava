  From the sales and costs below, work out for March:
  1. Total revenue
  2. Total costs
  3. Profit (revenue minus costs)
  4. Which product brought in the most revenue, and how much
  Reply with those four lines only, with the figures.

  SALES (date, product, units sold, price per unit)
